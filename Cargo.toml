[package]
name = "puzzle-ink"
version = "0.96.1"
edition = "2021"
description = "A shared desktop drawing overlay for Windows, X11 and Apple Silicon Macs"
publish = false

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol", "macos-private-api"] }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
flate2 = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "std"] }

[build-dependencies]
flate2 = "1"
tauri-build = "2"

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
tokio-tungstenite = "0.29"

[profile.release]
strip = true
opt-level = "s"
