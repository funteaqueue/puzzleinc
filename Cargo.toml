[package]
name = "puzzle-ink"
version = "0.96.0"
edition = "2021"
description = "A shared desktop drawing overlay for Windows and X11"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["custom-protocol"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
flate2 = "1"
tempfile = "3"

[build-dependencies]
flate2 = "1"
tauri-build = "2"

[dev-dependencies]
tokio-tungstenite = "0.29"

[profile.release]
strip = true
opt-level = "s"
